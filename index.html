<script>
    // ESTA É A CHAVE QUE CONECTA SEUS DISPOSITIVOS
    // Se quiser que outro site use o mesmo banco, use o mesmo ID
    const CLOUD_ID = "onmi_acai_global_v8"; 

    // Função que envia o status para a nuvem
    async function sincronizarComNuvem(dados) {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${CLOUD_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': '$2b$10$EXEMPLO' }, // Exemplo de estrutura
                body: JSON.stringify(dados)
            });
        } catch (e) { console.log("Erro ao sincronizar"); }
    }

    // Função que busca o status da nuvem
    async function buscarStatusNuvem() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${CLOUD_ID}/latest`);
            const data = await res.json();
            lojaAberta = data.record.lojaAberta;
            updateStatusUI();
        } catch (e) { console.log("Erro ao buscar"); }
    }

    // Verificando o status a cada 30 segundos para fechar no cliente automaticamente
    setInterval(buscarStatusNuvem, 30000);
</script>
