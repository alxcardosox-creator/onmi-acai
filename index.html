<script>
    /* ===========================================================
       MODO CRIADOR - EDITADO CONFORME SEUS PRINTS
       ===========================================================
    */

    const GITHUB_BASE = "https://raw.githubusercontent.com/alxcardosox-creator/onmi-acai/main/";
    const TAXA_ENTREGA = 3.00;

    const CARDAPIO = [
        {
            categoria: "Açaí na Garrafa",
            itens: [
                { id: 1, nome: "Garrafa 300ml", preco: 9.00, img: "garrafa.jpg" },
                { id: 2, nome: "Garrafa 500ml", preco: 12.00, img: "garrafa.jpg" }
            ]
        },
        {
            categoria: "Açaí no Copo",
            itens: [
                { id: 3, nome: "Copo 250ml", preco: 6.00, img: "copo250.jpg" },
                { id: 4, nome: "Copo 300ml", preco: 8.00, img: "copo300.jpg" },
                { id: 5, nome: "Copo 400ml", preco: 12.00, img: "copo400.jpg" }
            ]
        }
    ];

    // Estrutura de adicionais baseada nas suas imagens
    const ESTRUTURA_ADICIONAIS = [
        {
            titulo: "Sabor do Açaí",
            limite: 1,
            opcoes: ["Açaí de Banana"] // Adicione mais sabores se tiver
        },
        {
            titulo: "Onde deseja os Complementos?",
            limite: 1,
            opcoes: ["Em cima", "Meio a Meio", "Só no meio", "Sem complementos", "Embaixo"]
        },
        {
            titulo: "Complementos",
            limite: 6,
            opcoes: [
                "Granola", "Aveia", "Chocoboll", "Flocos de arroz", "Leite em pó", 
                "Completo", "Paçoca", "Sucrilhos", "Jujuba", "Amendoim",
                "Granulado preto", "Coco ralado", "Granulado colorido", "Marshmallow",
                "Amendoim colorido", "Delicado (bala )", "argola colorida"
            ]
        },
        {
            titulo: "Coberturas",
            limite: 1,
            opcoes: [
                "Uva", "Morango", "Maçã verde", "Kiwi", "Chocolate suíço",
                "TuttiFruit", "Milho", "Maracujá", "Leite condensado", "Menta"
            ]
        },
        {
            titulo: "Deseja frutas?",
            limite: 3,
            opcoes: ["Morango", "Banana"]
        },
        {
            titulo: "Adicionais Extras",
            limite: 5,
            opcoes: ["Potinho de Nutella"]
        }
    ];

    /* ===========================================================
       LÓGICA DO SISTEMA
       ===========================================================
    */

    let carrinho = [];
    let itemSelecionado = null;

    function renderizarCardapio() {
        const container = document.getElementById('cardapio-container');
        let html = '';
        CARDAPIO.forEach(cat => {
            html += `<div class="categoria-titulo">${cat.categoria}</div>`;
            cat.itens.forEach(prod => {
                html += `
                    <div class="produto-card" onclick="abrirOpcionais('${prod.nome}', ${prod.preco})">
                        <div class="produto-info">
                            <h3>${prod.nome}</h3>
                            <span class="preco">R$ ${prod.preco.toFixed(2)}</span>
                        </div>
                        <div class="img-container">
                            <img src="${GITHUB_BASE}${prod.img}" class="produto-img" 
                                 onerror="this.parentElement.innerHTML='<i class=\'fas fa-ice-cream\' style=\'color:#ddd; font-size:24px\'></i>'">
                        </div>
                    </div>`;
            });
        });
        container.innerHTML = html;
    }

    function configurarAdicionais() {
        const lista = document.getElementById('lista-adicionais');
        let html = '';

        ESTRUTURA_ADICIONAIS.forEach((secao, idxSecao) => {
            html += `
                <div style="background:#f9f9f9; padding:10px; margin-top:15px; border-radius:10px;">
                    <strong style="color:var(--roxo-principal); font-size:14px;">${secao.titulo}</strong><br>
                    <small style="color:#666;">Escolha até ${secao.limite} item(ns)</small>
                </div>
            `;
            secao.opcoes.forEach(opcao => {
                html += `
                    <label style="display:flex; align-items:center; padding:12px; border-bottom:1px solid #eee; cursor:pointer;">
                        <input type="checkbox" class="extra-item" data-secao="${idxSecao}" value="${opcao}" 
                               onclick="verificarLimite(this, ${secao.limite})" style="width:18px; height:18px; margin-right:12px;">
                        <span style="font-size:14px;">${opcao}</span>
                    </label>
                `;
            });
        });
        lista.innerHTML = html;
    }

    function verificarLimite(checkbox, limite) {
        const secao = checkbox.getAttribute('data-secao');
        const selecionados = document.querySelectorAll(`.extra-item[data-secao="${secao}"]:checked`);
        if (selecionados.length > limite) {
            checkbox.checked = false;
            alert(`Nesta seção você pode escolher no máximo ${limite} item(ns).`);
        }
    }

    function abrirOpcionais(nome, preco) {
        itemSelecionado = { nome, preco };
        document.getElementById('nomeProdModal').innerText = nome;
        document.getElementById('modalOpcionais').style.display = 'flex';
        document.querySelectorAll('.extra-item').forEach(el => el.checked = false);
    }

    function fecharModal(id) { document.getElementById(id).style.display = 'none'; }

    function adicionarAoCarrinho() {
        let escolhidos = [];
        document.querySelectorAll('.extra-item:checked').forEach(el => escolhidos.push(el.value));
        carrinho.push({ 
            ...itemSelecionado, 
            acompanhamentos: escolhidos.length > 0 ? escolhidos.join(', ') : 'Natural' 
        });
        atualizarInterface();
        fecharModal('modalOpcionais');
    }

    function atualizarInterface() {
        let subtotal = carrinho.reduce((acc, i) => acc + i.preco, 0);
        document.getElementById('barraCarrinho').style.display = carrinho.length > 0 ? 'flex' : 'none';
        document.getElementById('qtdItens').innerText = carrinho.length;
        document.getElementById('totalFlutuante').innerText = 'R$ ' + (subtotal + TAXA_ENTREGA).toFixed(2);
    }

    function abrirCarrinho() {
        let container = document.getElementById('itensNoCarrinho');
        if(carrinho.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#999">Sua sacola está vazia</p>';
        } else {
            container.innerHTML = carrinho.map((i, index) => `
                <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px">
                    <div style="flex:1">
                        <div style="font-weight:bold; font-size:14px">${i.nome}</div>
                        <div style="font-size:12px; color:#777; line-height:1.4;">${i.acompanhamentos}</div>
                    </div>
                    <div style="text-align:right; margin-left:10px;">
                        <div style="font-size:14px; font-weight:bold">R$ ${i.preco.toFixed(2)}</div>
                        <small style="color:red; cursor:pointer" onclick="removerItem(${index})">Remover</small>
                    </div>
                </div>
            `).join('');
            
            let subtotal = carrinho.reduce((acc, i) => acc + i.preco, 0);
            container.innerHTML += `
                <div style="margin-top:15px; border-top:2px dashed #eee; padding-top:10px">
                    <div style="display:flex; justify-content:space-between; font-size:14px"><span>Subtotal:</span> <span>R$ ${subtotal.toFixed(2)}</span></div>
                    <div style="display:flex; justify-content:space-between; font-size:14px"><span>Entrega:</span> <span>R$ ${TAXA_ENTREGA.toFixed(2)}</span></div>
                    <div style="display:flex; justify-content:space-between; font-size:18px; font-weight:800; margin-top:5px; color:var(--roxo-principal)">
                        <span>Total:</span> <span>R$ ${(subtotal + TAXA_ENTREGA).toFixed(2)}</span>
                    </div>
                </div>
            `;
        }
        document.getElementById('modalCarrinho').style.display = 'flex';
    }

    function removerItem(index) {
        carrinho.splice(index, 1);
        atualizarInterface();
        abrirCarrinho();
    }

    function finalizarPedido() {
        const nome = document.getElementById('nomeCliente').value;
        const endereco = document.getElementById('enderecoCliente').value;
        const pag = document.getElementById('formaPagamento').value;

        if(!nome || !endereco || !pag) return alert("Por favor, preencha todos os dados de entrega!");

        let subtotal = carrinho.reduce((acc, i) => acc + i.preco, 0);
        let total = subtotal + TAXA_ENTREGA;
        
        let msg = `*🟣 NOVO PEDIDO - ONMI AÇAÍ*%0A%0A`;
        msg += `*Cliente:* ${nome}%0A*Endereço:* ${endereco}%0A*Pagamento:* ${pag}%0A%0A`;
        msg += `*---------- ITENS ----------*%0A`;
        carrinho.forEach(i => {
            msg += `✅ *${i.nome}*%0A   _Escolhas: ${i.acompanhamentos}_%0A   R$ ${i.preco.toFixed(2)}%0A%0A`;
        });
        msg += `*---------------------------*%0A`;
        msg += `*Subtotal:* R$ ${subtotal.toFixed(2)}%0A`;
        msg += `*Entrega:* R$ ${TAXA_ENTREGA.toFixed(2)}%0A`;
        msg += `*TOTAL: R$ ${total.toFixed(2)}*`;

        window.open(`https://wa.me/5521988626495?text=${msg}`);
    }

    window.onscroll = () => {
        const header = document.getElementById("mainHeader");
        window.scrollY > 50 ? header.classList.add("scrolled") : header.classList.remove("scrolled");
    };

    renderizarCardapio();
    configurarAdicionais();
</script>
