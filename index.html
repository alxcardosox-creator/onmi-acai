<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onmi Açaí | Delivery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --roxo-principal: #5b0f73;
            --verde-sucesso: #27ae60;
            --cinza-fundo: #f4f4f4;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: var(--cinza-fundo);
            padding-bottom: 100px;
        }

        header {
            background: var(--roxo-principal);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: 0.3s;
        }

        header.scrolled { padding: 10px; }
        header.scrolled .logo-img { max-width: 60px; }

        .logo-img { max-width: 100px; transition: 0.3s; border-radius: 50%; }

        .status-badge {
            display: block;
            background: white;
            color: var(--verde-sucesso);
            font-size: 12px;
            font-weight: bold;
            width: fit-content;
            margin: 8px auto 0;
            padding: 3px 12px;
            border-radius: 20px;
        }

        .container { max-width: 600px; margin: auto; }

        .categoria-titulo {
            padding: 25px 15px 10px;
            font-size: 18px;
            font-weight: 800;
            color: var(--roxo-principal);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .produto-card {
            display: flex;
            background: white;
            margin: 10px 15px;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            align-items: center;
            transition: 0.2s;
        }

        .produto-card:active { transform: scale(0.98); }

        .produto-info { flex: 1; }
        .produto-info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .preco { font-weight: bold; color: #444; }

        .produto-img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
            background: #eee;
        }

        /* Modais */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            align-items: flex-end;
        }

        .modal-content {
            background: white;
            width: 100%;
            border-radius: 25px 25px 0 0;
            padding: 25px;
            max-height: 85vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .btn-acao {
            background: var(--roxo-principal);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
        }

        .footer-carrinho {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: var(--roxo-principal);
            color: white;
            padding: 15px 20px;
            border-radius: 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>

<header id="mainHeader">
    <img src="https://raw.githubusercontent.com/alxcardosox-creator/onmi-acai/main/logo.png" class="logo-img" alt="Onmi Açaí">
    <span class="status-badge">● Aberto Agora</span>
</header>

<div class="container" id="cardapio-container">
    </div>

<div id="modalOpcionais" class="modal">
    <div class="modal-content">
        <h2 id="nomeProdModal">Adicionais</h2>
        <div id="lista-adicionais">
            </div>
        <button class="btn-acao" onclick="adicionarAoCarrinho()">Adicionar à Sacola</button>
        <button class="btn-acao" style="background:#eee; color:#666;" onclick="fecharModal('modalOpcionais')">Cancelar</button>
    </div>
</div>

<div id="modalCarrinho" class="modal">
    <div class="modal-content">
        <h2>Sua Sacola</h2>
        <div id="itensNoCarrinho"></div>
        <hr>
        <input type="text" id="nomeCliente" placeholder="Seu Nome">
        <input type="text" id="enderecoCliente" placeholder="Endereço Completo">
        <select id="formaPagamento">
            <option value="">Forma de Pagamento</option>
            <option value="Pix">Pix</option>
            <option value="Cartão">Cartão de Crédito/Débito</option>
            <option value="Dinheiro">Dinheiro</option>
        </select>
        <button class="btn-acao" onclick="finalizarPedido()">Finalizar Pedido via WhatsApp</button>
    </div>
</div>

<div id="barraCarrinho" class="footer-carrinho" onclick="abrirCarrinho()">
    <span><i class="fas fa-shopping-basket"></i> <span id="qtdItens">0</span> itens</span>
    <span id="totalFlutuante">R$ 0,00</span>
</div>

<script>
    // ==========================================
    // MODO CRIADOR: Edite aqui seus produtos!
    // ==========================================
    const CARDAPIO = [
        {
            categoria: "Açaí na Garrafa",
            itens: [
                { id: 1, nome: "Garrafa 300ml", preco: 9.00, img: "garrafa.jpg" },
                { id: 2, nome: "Garrafa 500ml", preco: 12.00, img: "garrafa.jpg" }
            ]
        },
        {
            categoria: "Açaí no Copo",
            itens: [
                { id: 3, nome: "Copo 250ml", preco: 6.00, img: "copo250.jpg" },
                { id: 4, nome: "Copo 300ml", preco: 8.00, img: "copo300.jpg" },
                { id: 5, nome: "Copo 400ml", preco: 12.00, img: "copo400.jpg" }
            ]
        }
    ];

    const ADICIONAIS = ["Leite em Pó", "Granola", "Paçoca", "Banana", "Leite Condensado", "Morango"];
    const TAXA_ENTREGA = 3.00;
    const GITHUB_BASE = "https://raw.githubusercontent.com/alxcardosox-creator/onmi-acai/main/";

    let carrinho = [];
    let itemSelecionado = null;

    // Gerar Cardápio Automaticamente
    function renderizarCardapio() {
        const container = document.getElementById('cardapio-container');
        let html = '';

        CARDAPIO.forEach(cat => {
            html += `<div class="categoria-titulo">${cat.categoria}</div>`;
            cat.itens.forEach(prod => {
                html += `
                    <div class="produto-card" onclick="abrirOpcionais('${prod.nome}', ${prod.preco})">
                        <div class="produto-info">
                            <h3>${prod.nome}</h3>
                            <span class="preco">R$ ${prod.preco.toFixed(2)}</span>
                        </div>
                        <img src="${GITHUB_BASE}${prod.img}" class="produto-img" onerror="this.src='https://via.placeholder.com/80?text=Acai'">
                    </div>
                `;
            });
        });
        container.innerHTML = html;
    }

    // Configurar Adicionais no Modal
    function configurarAdicionais() {
        const lista = document.getElementById('lista-adicionais');
        lista.innerHTML = ADICIONAIS.map(add => `
            <label style="display:block; padding:10px; border-bottom:1px solid #eee;">
                <input type="checkbox" class="extra" value="${add}"> ${add}
            </label>
        `).join('');
    }

    function abrirOpcionais(nome, preco) {
        itemSelecionado = { nome, preco };
        document.getElementById('nomeProdModal').innerText = nome;
        document.getElementById('modalOpcionais').style.display = 'flex';
    }

    function fecharModal(id) { document.getElementById(id).style.display = 'none'; }

    function adicionarAoCarrinho() {
        let extras = [];
        document.querySelectorAll('.extra:checked').forEach(el => extras.push(el.value));
        carrinho.push({ ...itemSelecionado, acompanhamentos: extras.join(', ') || 'Sem adicionais' });
        
        atualizarInterface();
        fecharModal('modalOpcionais');
        document.querySelectorAll('.extra').forEach(el => el.checked = false);
    }

    function atualizarInterface() {
        let total = carrinho.reduce((acc, i) => acc + i.preco, 0);
        document.getElementById('barraCarrinho').style.display = carrinho.length > 0 ? 'flex' : 'none';
        document.getElementById('qtdItens').innerText = carrinho.length;
        document.getElementById('totalFlutuante').innerText = 'Total: R$ ' + (total + TAXA_ENTREGA).toFixed(2);
    }

    function abrirCarrinho() {
        let container = document.getElementById('itensNoCarrinho');
        container.innerHTML = carrinho.map(i => `
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:14px">
                <span><b>${i.nome}</b><br><small>${i.acompanhamentos}</small></span>
                <span>R$ ${i.preco.toFixed(2)}</span>
            </div>
        `).join('');
        document.getElementById('modalCarrinho').style.display = 'flex';
    }

    function finalizarPedido() {
        const nome = document.getElementById('nomeCliente').value;
        const endereco = document.getElementById('enderecoCliente').value;
        const pag = document.getElementById('formaPagamento').value;

        if(!nome || !endereco || !pag) return alert("Preencha todos os campos!");

        let total = carrinho.reduce((acc, i) => acc + i.preco, 0) + TAXA_ENTREGA;
        let msg = `*NOVO PEDIDO - ONMI AÇAÍ*%0A%0A`;
        msg += `*Cliente:* ${nome}%0A*Endereço:* ${endereco}%0A*Pagamento:* ${pag}%0A%0A`;
        msg += `*ITENS:*%0A`;
        carrinho.forEach(i => msg += `• ${i.nome} (R$ ${i.preco.toFixed(2)})%0A  _Adicionais: ${i.acompanhamentos}_%0A`);
        msg += `%0A*Entrega:* R$ ${TAXA_ENTREGA.toFixed(2)}%0A*TOTAL: R$ ${total.toFixed(2)}*`;

        window.open(`https://wa.me/5521988626495?text=${msg}`);
    }

    window.onscroll = () => {
        const header = document.getElementById("mainHeader");
        window.scrollY > 50 ? header.classList.add("scrolled") : header.classList.remove("scrolled");
    };

    // Inicialização
    renderizarCardapio();
    configurarAdicionais();
</script>

</body>
</html>
