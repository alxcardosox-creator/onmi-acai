<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onmi Açaí | Admin Full</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #5b0f73; --success: #27ae60; --danger: #e74c3c; --bg: #f8f9fa; --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: var(--bg); padding-bottom: 100px; }

        header { background: var(--primary); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1100; color: white; }
        .logo-img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid white; cursor: pointer; }

        .nav-categories { background: white; padding: 12px; position: sticky; top: 72px; z-index: 1000; display: flex; gap: 8px; overflow-x: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .cat-item { padding: 6px 15px; background: #eee; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
        .cat-item.active { background: var(--primary); color: white; }

        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .section-header { font-weight: 800; color: #7f8c8d; margin: 20px 0 10px; text-transform: uppercase; font-size: 12px; }

        .produto-card { display: flex; background: white; margin-bottom: 12px; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); align-items: center; }
        .produto-info { flex: 1; }
        .produto-info h3 { margin: 0; font-size: 15px; }
        .preco { color: var(--primary); font-weight: 700; }
        .img-prod { width: 70px; height: 70px; border-radius: 10px; object-fit: cover; margin-left: 10px; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; align-items: flex-end; }
        .modal-content { background: white; width: 100%; border-radius: 20px 20px 0 0; max-height: 90vh; overflow-y: auto; padding-bottom: 30px; }

        .admin-section { background: #f1f2f6; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        .admin-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ddd; align-items: center; font-size: 13px; }

        input, select { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ccc; border-radius: 8px; }
        .btn { width: 90%; margin: 10px auto; display: block; padding: 15px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }

        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; inset: 0; background: #ccc; border-radius: 20px; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background: white; border-radius: 50%; transition: .4s; }
        input:checked + .slider { background: var(--success); }
        input:checked + .slider:before { transform: translateX(16px); }

        .footer-cart { position: fixed; bottom: 15px; left: 5%; width: 90%; background: var(--primary); color: white; padding: 15px; border-radius: 12px; display: none; justify-content: space-between; font-weight: 700; z-index: 1500; }
    </style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap:10px;">
        <img src="https://raw.githubusercontent.com/alxcardosox-creator/onmi-acai/main/logo.png" class="logo-img" id="logoAdmin">
        <span style="font-weight:800;">ONMI AÇAÍ</span>
    </div>
    <div id="statusLoja" style="font-size:10px; padding:4px 10px; border-radius:10px; background:#27ae60;">ABERTO</div>
</header>

<div class="nav-categories" id="navCats">
    </div>

<div class="container" id="cardapioHome">
    </div>

<div id="modalAdmin" class="modal">
    <div class="modal-content" style="padding: 20px;">
        <h2 style="color:var(--primary); margin-top:0;">Painel Admin</h2>
        
        <div class="admin-section">
            <h4 style="margin:0;">📦 NOVO PRODUTO PRINCIPAL</h4>
            <p style="font-size:10px;">(Ex: Copo 1 Litro, Refrigerante, etc)</p>
            <input type="text" id="pNome" placeholder="Nome do Produto">
            <input type="number" id="pPreco" placeholder="Preço (ex: 15.00)">
            <select id="pCat">
                <option value="copo">Açaí no Copo</option>
                <option value="garrafa">Açaí na Garrafa</option>
                <option value="pastel">Pastel da Nana</option>
                <option value="bebida">Bebidas</option>
            </select>
            <button class="btn btn-success" onclick="addProdutoPrincipal()">Cadastrar Produto</button>
        </div>

        <div class="admin-section">
            <h4 style="margin:0;">✨ NOVO COMPLEMENTO/SABOR</h4>
            <input type="text" id="cNome" placeholder="Nome (Ex: Leite Ninho)">
            <input type="number" id="cPreco" placeholder="Preço Adicional">
            <select id="cPai">
                <option value="copo">Para Açaí (Copo)</option>
                <option value="pastel_t">Para Pastel Tradicional</option>
                <option value="pastel_e">Para Pastel Especial</option>
            </select>
            <input type="text" id="cSec" placeholder="Categoria (Ex: Caldas, Frutas, Sabores)">
            <button class="btn btn-primary" onclick="addExtra()">Cadastrar Complemento</button>
        </div>

        <h3>Gerenciar Itens</h3>
        <div id="listaGerenciar" style="max-height: 200px; overflow-y: auto; background: white; border-radius: 10px;"></div>
        
        <button class="btn btn-primary" onclick="fecharModal('modalAdmin')">Fechar Admin</button>
        <p onclick="resetarTudo()" style="color:red; text-align:center; font-size:11px; cursor:pointer;">Resetar Sistema</p>
    </div>
</div>

<div id="modalCompra" class="modal">
    <div class="modal-content">
        <div style="padding: 20px;"><h2 id="viewNome" style="margin:0;">Personalizar</h2></div>
        <div id="viewOpcoes"></div>
        <button class="btn btn-primary" onclick="adicionarAoCarrinho()">Adicionar ao Pedido</button>
        <p onclick="fecharModal('modalCompra')" style="text-align:center; color:#999; cursor:pointer;">Cancelar</p>
    </div>
</div>

<div id="barraCarrinho" class="footer-cart" onclick="alert('Funcionalidade de finalizar pedido ativa!')">
    <span>🛒 <span id="cartQtd">0</span> itens</span>
    <span id="cartTotal">R$ 0,00</span>
</div>

<script>
    // --- BANCO DE DADOS INICIAL (FORÇADO) ---
    const PRODUTOS_DEFAULT = [
        { id: 1, nome: "Copo 250ml", preco: 5.00, cat: "copo", d: true },
        { id: 2, nome: "Copo 300ml", preco: 8.00, cat: "copo", d: true },
        { id: 3, nome: "Copo 400ml", preco: 11.00, cat: "copo", d: true },
        { id: 4, nome: "Copo 500ml", preco: 13.00, cat: "copo", d: true },
        { id: 5, nome: "Copo 700ml", preco: 16.00, cat: "copo", d: true },
        { id: 8, nome: "Pastel Tradicional", preco: 7.00, cat: "pastel", d: true },
        { id: 9, nome: "Pastel Especial", preco: 8.00, cat: "pastel", d: true }
    ];

    const EXTRAS_DEFAULT = [
        { id: 101, n: "Granola", p: 0, cat: "copo", sec: "Complementos", d: true },
        { id: 102, n: "Leite em Pó", p: 0, cat: "copo", sec: "Complementos", d: true },
        { id: 103, n: "Amendoim", p: 0, cat: "copo", sec: "Complementos", d: true },
        { id: 104, n: "Morango", p: 0, cat: "copo", sec: "Frutas", d: true },
        { id: 105, n: "Banana", p: 0, cat: "copo", sec: "Frutas", d: true },
        { id: 106, n: "Leite Condensado", p: 0, cat: "copo", sec: "Caldas", d: true },
        { id: 107, n: "Nutella", p: 3.00, cat: "copo", sec: "Especiais", d: true },
        { id: 201, n: "Carne", p: 0, cat: "pastel_t", sec: "Sabores", d: true },
        { id: 202, n: "Frango", p: 0, cat: "pastel_t", sec: "Sabores", d: true },
        { id: 203, n: "Queijo", p: 0, cat: "pastel_t", sec: "Sabores", d: true },
        { id: 301, n: "Carne c/ Queijo", p: 0, cat: "pastel_e", sec: "Sabores", d: true },
        { id: 302, n: "Frango c/ Catupiry", p: 0, cat: "pastel_e", sec: "Sabores", d: true }
    ];

    // Carregamento Seguro
    let db_produtos = JSON.parse(localStorage.getItem('onmi_prods_v5')) || PRODUTOS_DEFAULT;
    let db_extras = JSON.parse(localStorage.getItem('onmi_exts_v5')) || EXTRAS_DEFAULT;
    let carrinho = [];
    let selecionado = null;

    // --- FUNÇÕES ADMIN ---
    let pressTimer;
    document.getElementById('logoAdmin').onmousedown = () => pressTimer = setTimeout(abrirAdmin, 2000);
    document.getElementById('logoAdmin').onmouseup = () => clearTimeout(pressTimer);
    document.getElementById('logoAdmin').ontouchstart = () => pressTimer = setTimeout(abrirAdmin, 2000);

    function abrirAdmin() { if(prompt("Senha:") === "onmi123") { document.getElementById('modalAdmin').style.display="flex"; renderAdminList(); } }

    function addProdutoPrincipal() {
        const nome = document.getElementById('pNome').value;
        const preco = parseFloat(document.getElementById('pPreco').value);
        const cat = document.getElementById('pCat').value;
        if(!nome || !preco) return alert("Preencha tudo!");
        db_produtos.push({ id: Date.now(), nome, preco, cat, d: true });
        salvar(); renderAdminList();
    }

    function addExtra() {
        const n = document.getElementById('cNome').value;
        const p = parseFloat(document.getElementById('cPreco').value) || 0;
        const cat = document.getElementById('cPai').value;
        const sec = document.getElementById('cSec').value || "Adicionais";
        if(!n) return alert("Nome vazio!");
        db_extras.push({ id: Date.now(), n, p, cat, sec, d: true });
        salvar(); renderAdminList();
    }

    function renderAdminList() {
        let html = '<div style="padding:10px"><b>Produtos Principais</b></div>';
        db_produtos.forEach(p => {
            html += `<div class="admin-item">
                <span>${p.nome}</span>
                <label class="switch"><input type="checkbox" ${p.d?'checked':''} onchange="toggleP(${p.id})"><span class="slider"></span></label>
            </div>`;
        });
        html += '<div style="padding:10px"><b>Complementos/Sabores</b></div>';
        db_extras.forEach(e => {
            html += `<div class="admin-item">
                <span>${e.n} (${e.sec})</span>
                <label class="switch"><input type="checkbox" ${e.d?'checked':''} onchange="toggleE(${e.id})"><span class="slider"></span></label>
            </div>`;
        });
        document.getElementById('listaGerenciar').innerHTML = html;
    }

    function toggleP(id) { const p = db_produtos.find(x=>x.id===id); p.d = !p.d; salvar(); }
    function toggleE(id) { const e = db_extras.find(x=>x.id===id); e.d = !e.d; salvar(); }
    function salvar() { 
        localStorage.setItem('onmi_prods_v5', JSON.stringify(db_produtos)); 
        localStorage.setItem('onmi_exts_v5', JSON.stringify(db_extras)); 
        renderMenu(); 
    }
    function resetarTudo() { localStorage.clear(); location.reload(); }

    // --- FUNÇÕES CARDÁPIO ---
    function renderMenu() {
        const cats = { copo: "Açaí no Copo", garrafa: "Açaí na Garrafa", pastel: "Pastel da Nana", bebida: "Bebidas" };
        let menuHtml = "";
        let navHtml = "";

        for (let key in cats) {
            const prods = db_produtos.filter(p => p.cat === key && p.d);
            if(prods.length > 0) {
                navHtml += `<div class="cat-item" onclick="document.getElementById('sec-${key}').scrollIntoView()">${cats[key]}</div>`;
                menuHtml += `<div id="sec-${key}" class="section-header">${cats[key]}</div>`;
                prods.forEach(p => {
                    menuHtml += `
                    <div class="produto-card" onclick="abrirCompra(${p.id})">
                        <div class="produto-info">
                            <h3>${p.nome}</h3>
                            <span class="preco">R$ ${p.preco.toFixed(2)}</span>
                        </div>
                        <img src="https://via.placeholder.com/70?text=Onmi" class="img-prod">
                    </div>`;
                });
            }
        }
        document.getElementById('navCats').innerHTML = navHtml;
        document.getElementById('cardapioHome').innerHTML = menuHtml;
    }

    function abrirCompra(id) {
        const p = db_produtos.find(x=>x.id===id);
        selecionado = p;
        document.getElementById('viewNome').innerText = p.nome;
        
        let filtro = p.cat;
        if(p.nome.includes("Tradicional")) filtro = 'pastel_t';
        if(p.nome.includes("Especial")) filtro = 'pastel_e';

        const extrasDisponiveis = db_extras.filter(e => e.cat === filtro && e.d);
        const secoes = [...new Set(extrasDisponiveis.map(e => e.sec))];

        document.getElementById('viewOpcoes').innerHTML = secoes.map(s => `
            <div style="background:#eee; padding:10px; font-size:12px; font-weight:bold;">${s}</div>
            ${extrasDisponiveis.filter(e => e.sec === s).map(e => `
                <label class="admin-item">
                    <span>${e.n} ${e.p>0?'+ R$'+e.p:''}</span>
                    <input type="${filtro.includes('pastel')?'radio':'checkbox'}" name="opc" value="${e.n}" data-preco="${e.p}">
                </label>
            `).join('')}
        `).join('');
        document.getElementById('modalCompra').style.display = "flex";
    }

    function adicionarAoCarrinho() {
        const checks = Array.from(document.querySelectorAll('input[name="opc"]:checked'));
        const nomes = checks.map(c => c.value);
        const extraPreco = checks.reduce((a, b) => a + parseFloat(b.dataset.preco), 0);
        
        carrinho.push({ nome: selecionado.nome, total: selecionado.preco + extraPreco });
        
        document.getElementById('barraCarrinho').style.display = "flex";
        document.getElementById('cartQtd').innerText = carrinho.length;
        const totalGeral = carrinho.reduce((a,b) => a+b.total, 0);
        document.getElementById('cartTotal').innerText = `R$ ${totalGeral.toFixed(2)}`;
        fecharModal('modalCompra');
    }

    function fecharModal(id) { document.getElementById(id).style.display = "none"; }

    renderMenu();
</script>
</body>
</html>
