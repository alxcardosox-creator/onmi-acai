<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onmi Açaí | Delivery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --roxo-principal: #5b0f73;
            --cinza-fundo: #f8f9fa;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--cinza-fundo);
            color: #333;
            padding-bottom: 100px;
        }

        /* Header que sobe e encolhe */
        header {
            background: var(--roxo-principal);
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: all 0.3s ease;
        }

        /* Estilo quando o usuário rola a página */
        header.scrolled {
            padding: 8px;
            transform: translateY(-5px);
        }

        .logo-img {
            max-width: 100px; /* Tamanho reduzido conforme pedido */
            height: auto;
            transition: all 0.3s ease;
        }

        header.scrolled .logo-img {
            max-width: 60px;
        }

        .status-badge {
            display: block;
            color: #27ae60;
            background: white;
            font-size: 11px;
            font-weight: bold;
            width: fit-content;
            margin: 5px auto 0;
            padding: 2px 10px;
            border-radius: 20px;
        }

        /* Categorias e Cards */
        .categoria-titulo {
            padding: 20px 15px 5px;
            font-size: 16px;
            font-weight: 800;
            color: var(--roxo-principal);
            text-transform: uppercase;
        }

        .produto-card {
            display: flex;
            background: white;
            margin: 10px 15px;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            align-items: center;
            cursor: pointer;
        }

        .produto-info { flex: 1; }
        .produto-info h3 { margin: 0; font-size: 15px; color: #222; }
        .produto-info .preco { color: #333; font-weight: bold; margin-top: 5px; display: block; font-size: 14px; }
        
        .cashback-badge {
            font-size: 10px;
            color: #27ae60;
            background: #e8f5e9;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 5px;
            display: inline-block;
        }

        .produto-img {
            width: 75px;
            height: 75px;
            border-radius: 8px;
            object-fit: cover;
            margin-left: 10px;
            background: #eee;
        }

        /* Modais */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 85vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .close-btn { font-size: 28px; cursor: pointer; color: #999; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }

        .btn-acao {
            background: var(--roxo-principal);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Rodapé Carrinho */
        .footer-carrinho {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 450px;
            background: var(--roxo-principal);
            color: white;
            padding: 15px;
            border-radius: 15px;
            display: none;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            z-index: 150;
        }

        .resumo-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<header id="mainHeader">
    <img src="https://raw.githubusercontent.com/alxcardosox-creator/onmi-acai/main/logo.png" class="logo-img" alt="Onmi Açaí">
    <span class="status-badge">Aberto • Japeri</span>
</header>

<div class="categoria-titulo">Açaí na Garrafa</div>
<div class="produto-card" onclick="abrirOpcionais('Garrafa 300ml', 9.00)">
    <div class="produto-info">
        <h3>300ml</h3>
        <span class="preco">R$ 9,00</span>
        <span class="cashback-badge">0% cashback</span>
    </div>
    <img src="https://raw.githubusercontent.com/alxcardosox-creator/onmi-acai/main/garrafa.jpg" class="produto-img">
</div>

<div class="produto-card" onclick="abrirOpcionais('Garrafa 500ml', 12.00)">
    <div class="produto-info">
        <h3>500ml</h3>
        <span class="preco">R$ 12,00</span>
        <span class="cashback-badge">0% cashback</span>
    </div>
    <img src="https://raw.githubusercontent.com/alxcardosox-creator/onmi-acai/main/garrafa.jpg" class="produto-img">
</div>

<div class="categoria-titulo">Açaí no Copo</div>
<div class="produto-card" onclick="abrirOpcionais('Copo 250ml', 6.00)">
    <div class="produto-info">
        <h3>250ml</h3>
        <span class="preco">R$ 6,00</span>
        <span class="cashback-badge">0% cashback</span>
    </div>
    <img src="https://raw.githubusercontent.com/alxcardosox-creator/onmi-acai/main/copo250.jpg" class="produto-img">
</div>

<div class="produto-card" onclick="abrirOpcionais('Copo 300ml', 8.00)">
    <div class="produto-info">
        <h3>300ml</h3>
        <span class="preco">R$ 8,00</span>
        <span class="cashback-badge">0% cashback</span>
    </div>
    <img src="https://raw.githubusercontent.com/alxcardosox-creator/onmi-acai/main/copo300.jpg" class="produto-img">
</div>

<div class="produto-card" onclick="abrirOpcionais('Copo 400ml', 12.00)">
    <div class="produto-info">
        <h3>400ml</h3>
        <span class="preco">R$ 12,00</span>
        <span class="cashback-badge">0% cashback</span>
    </div>
    <img src="https://raw.githubusercontent.com/alxcardosox-creator/onmi-acai/main/copo400.jpg" class="produto-img">
</div>

<div id="modalOpcionais" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between">
            <h2 id="nomeProdModal" style="margin:0; font-size:18px">Adicionais</h2>
            <span class="close-btn" onclick="fecharModal('modalOpcionais')">&times;</span>
        </div>
        <div style="margin: 15px 0">
            <label><input type="checkbox" class="extra" value="Leite em Pó"> Leite em Pó</label><br><br>
            <label><input type="checkbox" class="extra" value="Granola"> Granola</label><br><br>
            <label><input type="checkbox" class="extra" value="Paçoca"> Paçoca</label><br><br>
            <label><input type="checkbox" class="extra" value="Banana"> Banana</label>
        </div>
        <button class="btn-acao" onclick="adicionarAoCarrinho()">Adicionar à Sacola</button>
    </div>
</div>

<div id="modalCarrinho" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between">
            <h2 style="margin:0; font-size:18px">Sua Sacola</h2>
            <span class="close-btn" onclick="fecharModal('modalCarrinho')">&times;</span>
        </div>
        <div id="itensNoCarrinho" style="margin: 15px 0"></div>
        <input type="text" id="nomeCliente" placeholder="Seu Nome">
        <input type="text" id="enderecoCliente" placeholder="Endereço de Entrega">
        <select id="formaPagamento">
            <option value="">Forma de Pagamento</option>
            <option value="Pix">Pix</option>
            <option value="Dinheiro">Dinheiro</option>
            <option value="Cartão">Cartão</option>
        </select>
        <button class="btn-acao" onclick="finalizarPedido()">Enviar Pedido para WhatsApp</button>
    </div>
</div>

<div id="barraCarrinho" class="footer-carrinho" onclick="abrirCarrinho()">
    <div><i class="fas fa-shopping-cart"></i> <span id="qtdItens">0</span> itens</div>
    <div id="totalFlutuante" style="font-weight:bold">R$ 0,00</div>
    <div style="background:white; color:var(--roxo-principal); padding:5px 10px; border-radius:8px; font-weight:bold">Ver Sacola</div>
</div>

<script>
    let carrinho = [];
    let itemSelecionado = {};

    // Efeito de Header ao rolar
    window.onscroll = function() {
        let header = document.getElementById("mainHeader");
        if (document.body.scrollTop > 50 || document.documentElement.scrollTop > 50) {
            header.classList.add("scrolled");
        } else {
            header.classList.remove("scrolled");
        }
    };

    function abrirOpcionais(nome, preco) {
        itemSelecionado = { nome, preco };
        document.getElementById('nomeProdModal').innerText = nome;
        document.getElementById('modalOpcionais').style.display = 'flex';
    }

    function fecharModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    function adicionarAoCarrinho() {
        let extras = [];
        document.querySelectorAll('.extra:checked').forEach(el => extras.push(el.value));
        carrinho.push({
            nome: itemSelecionado.nome,
            preco: itemSelecionado.preco,
            acompanhamentos: extras.join(', ') || 'Natural'
        });
        atualizarInterface();
        fecharModal('modalOpcionais');
        document.querySelectorAll('.extra').forEach(el => el.checked = false);
    }

    function atualizarInterface() {
        let total = carrinho.reduce((acc, item) => acc + item.preco, 0);
        document.getElementById('barraCarrinho').style.display = carrinho.length > 0 ? 'flex' : 'none';
        document.getElementById('qtdItens').innerText = carrinho.length;
        document.getElementById('totalFlutuante').innerText = 'Total: R$ ' + (total + 3).toFixed(2);
    }

    function abrirCarrinho() {
        let container = document.getElementById('itensNoCarrinho');
        container.innerHTML = '';
        let total = 0;
        carrinho.forEach((item, index) => {
            total += item.preco;
            container.innerHTML += `
                <div class="resumo-item">
                    <span>${item.nome}</span>
                    <span>R$ ${item.preco.toFixed(2)}</span>
                </div>
            `;
        });
        document.getElementById('modalCarrinho').style.display = 'flex';
    }

    function finalizarPedido() {
        let nome = document.getElementById('nomeCliente').value;
        let endereco = document.getElementById('enderecoCliente').value;
        let pag = document.getElementById('formaPagamento').value;

        if(!nome || !endereco || !pag) return alert("Por favor, preencha todos os dados!");

        let total = carrinho.reduce((acc, item) => acc + item.preco, 0) + 3;
        let msg = `*PEDIDO ONMI AÇAÍ*%0A%0A*Nome:* ${nome}%0A*Endereço:* ${endereco}%0A*Pagamento:* ${pag}%0A%0A*ITENS:*%0A`;
        carrinho.forEach(i => msg += `- ${i.nome}: R$ ${i.preco.toFixed(2)} (${i.acompanhamentos})%0A`);
        msg += `%0A*Entrega:* R$ 3,00%0A*TOTAL: R$ ${total.toFixed(2)}*`;

        window.open(`https://wa.me/5521988626495?text=${msg}`);
    }
</script>

</body>
</html>
