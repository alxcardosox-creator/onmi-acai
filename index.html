<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onmi Delivery</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>

<body>

<header>
  <h1>ONMI DELIVERY</h1>
  <p>Peça seu Açaí 🍇</p>
</header>

<section class="produtos">
  <h2>Escolha seu tamanho</h2>

  <div class="produto" onclick="addItem('300ml',7)">
    300ml - R$7
  </div>

  <div class="produto" onclick="addItem('400ml',10)">
    400ml - R$10
  </div>

  <div class="produto" onclick="addItem('500ml',12)">
    500ml - R$12
  </div>

  <div class="produto" onclick="addItem('700ml',16)">
    700ml - R$16
  </div>
</section>

<section class="carrinho">
  <h2>Carrinho</h2>
  <div id="lista"></div>

  <label>Bairro:</label>
  <select id="bairro" onchange="calcularTotal()">
    <option value="">Selecione</option>
    <option value="2">Beira Rio - R$2</option>
    <option value="3">Outros Bairros - R$3</option>
    <option value="0">Engenheiro Pedreira (Não entrega)</option>
  </select>

  <input type="text" id="cupom" placeholder="Cupom de desconto">
  <button onclick="aplicarCupom()">Aplicar Cupom</button>

  <h3>Total: R$ <span id="total">0</span></h3>

  <button class="finalizar" onclick="finalizarPedido()">Finalizar Pedido</button>
</section>

<section id="pagamento" class="hidden">
  <h2>Pagamento via Pix</h2>
  <img src="pix.png" width="250">
  <p>Chave Pix: 200.769.057-80</p>
  <button onclick="confirmarPagamento()">Já Paguei</button>
</section>

<script src="script.js"></script>
</body>
</html>
