<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onmi Açaí</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

header{
background:#5b0f73;
color:white;
padding:15px;
font-size:20px;
font-weight:bold;
}

.categoria{
padding:15px;
font-size:18px;
font-weight:bold;
}

.produto{
display:flex;
justify-content:space-between;
align-items:center;
background:white;
margin:10px;
padding:10px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.produto-info{
flex:1;
}

.produto-info h3{
margin:0;
font-size:16px;
}

.produto-info p{
margin:5px 0 0;
color:#5b0f73;
font-weight:bold;
}

.produto img{
width:90px;
height:90px;
border-radius:10px;
object-fit:cover;
}

button{
margin-top:8px;
background:#5b0f73;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
}

.carrinho{
position:fixed;
bottom:15px;
right:15px;
background:#5b0f73;
color:white;
padding:15px;
border-radius:50px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<header>🍧 Onmi Açaí</header>

<div class="categoria">Açaí no Copo</div>

<div class="produto">
<div class="produto-info">
<h3>200ml</h3>
<p>R$ 5,00</p>
<button onclick="addCarrinho('200ml',5)">Adicionar</button>
</div>
<img src="https://images.unsplash.com/photo-1625944525903-b1dba4c4c1a1">
</div>

<div class="produto">
<div class="produto-info">
<h3>300ml</h3>
<p>R$ 7,00</p>
<button onclick="addCarrinho('300ml',7)">Adicionar</button>
</div>
<img src="https://images.unsplash.com/photo-1625944525903-b1dba4c4c1a1">
</div>

<div class="produto">
<div class="produto-info">
<h3>400ml</h3>
<p>R$ 11,00</p>
<button onclick="addCarrinho('400ml',11)">Adicionar</button>
</div>
<img src="https://images.unsplash.com/photo-1625944525903-b1dba4c4c1a1">
</div>

<div class="produto">
<div class="produto-info">
<h3>500ml</h3>
<p>R$ 13,00</p>
<button onclick="addCarrinho('500ml',13)">Adicionar</button>
</div>
<img src="https://images.unsplash.com/photo-1625944525903-b1dba4c4c1a1">
</div>

<div class="produto">
<div class="produto-info">
<h3>700ml</h3>
<p>R$ 17,00</p>
<button onclick="addCarrinho('700ml',17)">Adicionar</button>
</div>
<img src="https://images.unsplash.com/photo-1625944525903-b1dba4c4c1a1">
</div>

<div class="carrinho" onclick="finalizarPedido()">
🛒 Finalizar
</div>

<script>
let carrinho = [];
let total = 0;

function addCarrinho(produto, preco){
carrinho.push(produto);
total += preco;
alert(produto + " adicionado!");
}

function finalizarPedido(){
let lista = carrinho.join(", ");
let taxa = 3;
let totalFinal = total + taxa;

let mensagem = `Olá, quero pedir:%0A${lista}%0ATaxa: R$3%0ATotal: R$${totalFinal}`;
window.open(`https://wa.me/5521988626495?text=${mensagem}`);
}
</script>

</body>
</html>
