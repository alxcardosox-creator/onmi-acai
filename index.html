<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onmi Açaí | Delivery</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
--primary:#5b0f73;
--accent:#ffc107;
--success:#27ae60;
--bg:#f6f6f6;
--white:#fff;
--shadow:0 6px 20px rgba(0,0,0,.08);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif}

body{background:var(--bg);padding-bottom:120px}

/* HEADER */
header{
background:linear-gradient(135deg,#5b0f73,#7b1fa2);
color:#fff;
padding:18px;
position:sticky;
top:0;
z-index:1000;
box-shadow:var(--shadow)
}

header h1{font-size:18px;font-weight:700}
header small{font-size:12px;opacity:.8}

/* PRODUTOS */
.container{max-width:600px;margin:auto;padding:15px}

.produto{
background:var(--white);
border-radius:18px;
padding:14px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:var(--shadow);
transition:.2s;
cursor:pointer
}

.produto:active{transform:scale(.96)}

.produto-info h3{font-size:15px}
.produto-info span{color:var(--success);font-weight:700}

.produto img{
width:80px;
height:80px;
border-radius:15px;
object-fit:cover;
margin-left:10px
}

/* BOTÃO FLUTUANTE */
.carrinho-bar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:var(--primary);
color:#fff;
padding:15px 25px;
border-radius:50px;
display:none;
align-items:center;
justify-content:space-between;
width:90%;
max-width:500px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
cursor:pointer;
animation:slideUp .3s ease
}

@keyframes slideUp{
from{transform:translate(-50%,100%);opacity:0}
to{transform:translate(-50%,0);opacity:1}
}

/* MODAL */
.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
z-index:2000;
align-items:flex-end
}

.modal-content{
background:#fff;
width:100%;
border-radius:25px 25px 0 0;
padding:20px;
max-height:90vh;
overflow:auto;
animation:up .3s ease
}

@keyframes up{
from{transform:translateY(100%)}
to{transform:translateY(0)}
}

input,select{
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:10px
}

button{
background:var(--primary);
color:#fff;
border:none;
width:100%;
padding:14px;
border-radius:12px;
font-weight:700;
cursor:pointer
}

.qtd-box{
display:flex;
align-items:center;
gap:10px;
margin-top:10px
}

.qtd-box button{
width:35px;
height:35px;
border-radius:50%;
padding:0
}
</style>
</head>
<body>

<header>
<h1>Onmi Açaí 🍧</h1>
<small>Delivery em Japeri • Taxa R$3</small>
</header>

<div class="container" id="lista"></div>

<div class="carrinho-bar" id="barra" onclick="abrirCarrinho()">
<span><i class="fas fa-shopping-bag"></i> <span id="qtd">0</span> itens</span>
<span id="total">R$0,00</span>
</div>

<div class="modal" id="modalCarrinho">
<div class="modal-content">
<h2 style="margin-bottom:15px">Seu Pedido</h2>
<div id="itens"></div>

<h3 style="margin-top:15px">Dados</h3>
<input type="text" id="nome" placeholder="Seu nome">
<input type="text" id="endereco" placeholder="Endereço completo">

<select id="pagamento">
<option value="">Forma de pagamento</option>
<option>Pix</option>
<option>Cartão</option>
<option>Dinheiro</option>
</select>

<button onclick="finalizar()">Finalizar no WhatsApp</button>
<p style="text-align:center;margin-top:10px;color:#777;cursor:pointer" onclick="fechar()">Continuar comprando</p>
</div>
</div>

<script>
const TAXA=3;
const WHATS="5521988626495";

const PRODUTOS=[
{nome:"Copo 200ml",preco:5,img:"https://via.placeholder.com/80"},
{nome:"Copo 300ml",preco:7,img:"https://via.placeholder.com/80"},
{nome:"Copo 400ml",preco:11,img:"https://via.placeholder.com/80"},
{nome:"Copo 500ml",preco:13,img:"https://via.placeholder.com/80"},
{nome:"Copo 700ml",preco:17,img:"https://via.placeholder.com/80"}
];

let carrinho=JSON.parse(localStorage.getItem("onmi"))||[];

function render(){
const lista=document.getElementById("lista");
lista.innerHTML=PRODUTOS.map((p,i)=>`
<div class="produto" onclick="add(${i})">
<div class="produto-info">
<h3>${p.nome}</h3>
<span>R$ ${p.preco.toFixed(2).replace('.',',')}</span>
</div>
<img src="${p.img}">
</div>
`).join("");
atualizar();
}

function add(i){
if(navigator.vibrate)navigator.vibrate(80);
carrinho.push(PRODUTOS[i]);
salvar();
}

function atualizar(){
const barra=document.getElementById("barra");
const qtd=document.getElementById("qtd");
const total=document.getElementById("total");

if(carrinho.length>0){
barra.style.display="flex";
qtd.innerText=carrinho.length;
let soma=carrinho.reduce((a,b)=>a+b.preco,0);
total.innerText="R$ "+(soma+TAXA).toFixed(2).replace('.',',');
}else{
barra.style.display="none";
}
}

function abrirCarrinho(){
document.getElementById("modalCarrinho").style.display="flex";
const itens=document.getElementById("itens");
itens.innerHTML=carrinho.map((i,idx)=>`
<div style="display:flex;justify-content:space-between;margin-bottom:8px">
<span>${i.nome}</span>
<span>R$ ${i.preco.toFixed(2).replace('.',',')}</span>
</div>
`).join("");
}

function fechar(){
document.getElementById("modalCarrinho").style.display="none";
}

function finalizar(){
const nome=document.getElementById("nome").value;
const endereco=document.getElementById("endereco").value;
const pag=document.getElementById("pagamento").value;
if(!nome||!endereco||!pag) return alert("Preencha tudo");

let subtotal=carrinho.reduce((a,b)=>a+b.preco,0);
let msg=`🟣 *NOVO PEDIDO ONMI*%0ACliente: ${nome}%0AEndereço: ${endereco}%0APagamento: ${pag}%0A----------------%0A`;
carrinho.forEach(i=>msg+=`${i.nome} - R$${i.preco}%0A`);
msg+=`----------------%0ASubtotal: R$${subtotal}%0ATaxa: R$${TAXA}%0ATOTAL: R$${subtotal+TAXA}`;

window.open(`https://wa.me/${WHATS}?text=${msg}`);
carrinho=[];
salvar();
fechar();
}

function salvar(){
localStorage.setItem("onmi",JSON.stringify(carrinho));
atualizar();
}

render();
</script>
</body>
</html>
